<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - CareerHub</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .auth-container {
        min-height: calc(100vh - 72px - 250px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
      }
      .auth-card {
        width: 100%;
        max-width: 440px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 36px 32px;
        box-shadow: var(--shadow-md);
      }
      .auth-header {
        text-align: center;
        margin-bottom: 28px;
      }
      .auth-header h1 {
        font-size: 24px;
        color: var(--ink);
        margin-bottom: 8px;
      }
      .auth-header p {
        color: var(--muted);
        font-size: 14px;
        margin: 0;
      }
      .form-error {
        color: #be4848;
        font-size: 12px;
        margin-top: 4px;
        display: none;
      }
      .alert-box {
        display: none;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        margin-bottom: 20px;
      }
      .alert-box.error {
        display: block;
        background-color: var(--error-bg);
        color: #be4848;
        border: 1px solid #f5c2c2;
      }
      .alert-box.info {
        display: block;
        background-color: var(--info-bg);
        color: var(--indigo);
        border: 1px solid var(--accent);
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="site-header">
      <div class="container site-navbar">
        <a href="index.html" class="brand-logo" title="CareerHub">
          <img src="Logo Career Connect.png" alt="CareerHub Logo" />
        </a>
        <div class="nav-actions">
          <span style="font-size: 13px; color: var(--muted)">Chưa có tài khoản?</span>
          <a href="register.html" class="btn btn-outline">Đăng ký</a>
        </div>
      </div>
    </header>

    <!-- Main Form -->
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Chào mừng trở lại</h1>
          <p>Đăng nhập để kết nối cơ hội việc làm và thực tập</p>
        </div>

        <!-- Khung thông báo chung (Lỗi backend, token hết hạn) -->
        <div id="login-alert" class="alert-box"></div>

        <form id="form-login" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-email">Địa chỉ Email</label>
            <input
              type="email"
              id="login-email"
              class="form-control"
              placeholder="name@example.com"
              required
            />
            <div class="form-error" id="err-login-email">Email không đúng định dạng.</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Mật khẩu</label>
            <input
              type="password"
              id="login-password"
              class="form-control"
              placeholder="Nhập mật khẩu"
              required
            />
            <div class="form-error" id="err-login-password">Vui lòng nhập mật khẩu.</div>
          </div>

          <button type="submit" id="btn-submit-login" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
            Đăng nhập
          </button>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
